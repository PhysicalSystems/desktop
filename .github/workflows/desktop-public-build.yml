name: Build public desktop installers (qualification incomplete)
run-name: Public desktop ${{ inputs.channel }} from ${{ github.sha }}

# Packaging and smoke evidence are real, but native public qualification is not
# complete. The final job fails deliberately and no qualified bundle is emitted.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Public identity version track; no publication or upgrade
        type: choice
        options: [preview, stable]
        default: preview
        required: true
      version:
        description: Optional preview version; stable requires an explicit version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-public-build
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  PHYSICALSYSTEMS_RELEASE_REPOSITORY: PhysicalSystems/desktop

jobs:
  prepare:
    name: Freeze reviewed main and provisioned public signing policy
    if: github.repository == 'PhysicalSystems/desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
      inputs_sha256: ${{ steps.inputs.outputs.inputs_sha256 }}
      public_build_sha256: ${{ steps.inputs.outputs.public_build_sha256 }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"
      - name: Freeze source and validate the explicit signing policy before builds
        id: policy
        env:
          DESKTOP_PUBLIC_BUILD_ENABLED: ${{ vars.DESKTOP_PUBLIC_BUILD_ENABLED }}
          DESKTOP_WINDOWS_SIGNING_POLICY: ${{ vars.DESKTOP_WINDOWS_SIGNING_POLICY }}
          PUBLIC_POLICY_DIRECTORY: ${{ runner.temp }}/desktop-public-policy
        run: bun script/desktop-public-producer.ts preflight
      - name: Read complete download-repository history, including drafts
        env:
          # Read-only contents access to the separate download repository. The
          # desktop GITHUB_TOKEN cannot read that repository's draft releases.
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_HISTORY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Provision DESKTOP_RELEASE_HISTORY_TOKEN with read-only contents access to the download repository.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/desktop-public"
          gh api --paginate --slurp 'repos/PhysicalSystems/physicalsystems/releases?per_page=100' > "$RUNNER_TEMP/desktop-public/history-pages.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'desktop-public');
          const pages = JSON.parse(readFileSync(path.join(root, 'history-pages.json'), 'utf8'));
          if (!Array.isArray(pages) || !pages.length || pages.some(page => !Array.isArray(page))) throw new Error('Incomplete release history');
          const releases = pages.flat();
          if (releases.some(release => typeof release.tag_name !== 'string')) throw new Error('Malformed release history');
          const versions = releases.filter(release => release.tag_name.startsWith('desktop-v')).map(release => release.tag_name.slice('desktop-v'.length));
          writeFileSync(path.join(root, 'history.json'), JSON.stringify({ complete: true, versions }, null, 2) + '\n');
          NODE
      - name: Prepare and verify frozen release inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          args=(--source-sha "$GITHUB_SHA" --repository PhysicalSystems/desktop --channel "$CHANNEL" --history "$RUNNER_TEMP/desktop-public/history.json" --output "$RUNNER_TEMP/desktop-public/inputs")
          if [ -n "$REQUESTED_VERSION" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          bun script/desktop-release.ts prepare "${args[@]}"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const inputs = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'desktop-public/inputs/release-inputs.json'), 'utf8'));
          if (!/^[a-f0-9]{64}$/.test(inputs.sha256)) throw new Error('Missing immutable release input digest');
          appendFileSync(process.env.GITHUB_ENV, `EXPECTED_RELEASE_INPUTS_SHA256=${inputs.sha256}\n`);
          NODE
      - name: Bind the frozen public identity and policy to the verified release inputs
        id: inputs
        env:
          PUBLIC_RELEASE_INPUTS: ${{ runner.temp }}/desktop-public/inputs/release-inputs.json
          PUBLIC_POLICY_FILE: ${{ runner.temp }}/desktop-public-policy/producer-policy.json
          EXPECTED_POLICY_SHA256: ${{ steps.policy.outputs.policy_sha256 }}
        run: bun script/desktop-public-producer.ts prepare
      - name: Retain only the immutable public input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-public-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-public/inputs/release-inputs.json
            ${{ runner.temp }}/desktop-public/inputs/public-build-inputs.json
            ${{ runner.temp }}/desktop-public/inputs/history.json
            ${{ runner.temp }}/desktop-public/inputs/models.dev-api.json
          if-no-files-found: error
          retention-days: 30

  source:
    name: Validate exact public source
    needs: prepare
    uses: ./.github/workflows/desktop-ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  package:
    name: Build and inspect public ${{ matrix.platform }} bytes
    needs: [prepare, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      EXPECTED_RELEASE_INPUTS_SHA256: ${{ needs.prepare.outputs.inputs_sha256 }}
      EXPECTED_PUBLIC_BUILD_SHA256: ${{ needs.prepare.outputs.public_build_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
      - name: Define isolated native paths after the runner is available
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import path from 'node:path';
          const paths = {
            PUBLIC_RELEASE_INPUTS: 'desktop-public/inputs/release-inputs.json',
            PUBLIC_BUILD_INPUTS: 'desktop-public/inputs/public-build-inputs.json',
            PUBLIC_BUILD_DIRECTORY: 'desktop-public/artifacts',
            PUBLIC_SMOKE_DIRECTORY: 'desktop-public/smoke',
          };
          appendFileSync(process.env.GITHUB_ENV, Object.entries(paths).map(([key, value]) => `${key}=${path.join(process.env.RUNNER_TEMP, value)}\n`).join(''));
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-public-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-public/inputs
      - name: Verify native source/archive and public producer regressions
        working-directory: packages/physicalsystems
        run: bun test ./src/release/commands.test.ts ./src/release/packaged-archive.test.ts ./src/release/public-build.test.ts ./src/release/public-build-command.test.ts ./src/release/public-producer.test.ts
      - name: Build Windows installers using the frozen signing policy
        if: runner.os == 'Windows'
        env:
          # Only this actual build step receives signing secrets. The wrapper
          # creates an exclusive temporary PFX and removes it even on failure.
          PHYSICALSYSTEMS_PFX_BASE64: ${{ secrets.DESKTOP_WINDOWS_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_PFX_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.DESKTOP_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.DESKTOP_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.DESKTOP_AZURE_CLIENT_SECRET }}
        run: bun script/desktop-public-producer.ts build-windows
      - name: Build Linux installers under the same frozen public identity
        if: runner.os == 'Linux'
        run: bun script/desktop-build-public.ts --inputs "$PUBLIC_RELEASE_INPUTS" --public-inputs "$PUBLIC_BUILD_INPUTS" --expected-inputs-sha256 "$EXPECTED_RELEASE_INPUTS_SHA256" --expected-public-build-sha256 "$EXPECTED_PUBLIC_BUILD_SHA256" --platform linux-x64 --output "$PUBLIC_BUILD_DIRECTORY"
      - name: Install display dependencies on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 apparmor libnotify4 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0 dbus gnome-keyring libglib2.0-bin
      - name: Inspect exact public packages and record missing native qualification
        run: |
          if [ "$RUNNER_OS" = 'Linux' ]; then
            xvfb-run -a bun script/desktop-public-smoke.ts
          else
            bun script/desktop-public-smoke.ts
          fi
      # This allowlist deliberately excludes profiles, logs, signing files and
      # dependency caches. No artifact uses the publisher's qualified name.
      - name: Retain exact installers and explicitly unqualified build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-public-unqualified-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-public/artifacts/physical-systems-desktop-${{ needs.prepare.outputs.version }}-windows-x64.exe
            ${{ runner.temp }}/desktop-public/artifacts/physical-systems-desktop-${{ needs.prepare.outputs.version }}-linux-x64.deb
            ${{ runner.temp }}/desktop-public/artifacts/physical-systems-desktop-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
            ${{ runner.temp }}/desktop-public/artifacts/artifacts.json
            ${{ runner.temp }}/desktop-public/artifacts/SHA256SUMS
            ${{ runner.temp }}/desktop-public/artifacts/desktop-release-inputs.json
            ${{ runner.temp }}/desktop-public/artifacts/public-build-inputs.json
            ${{ runner.temp }}/desktop-public/artifacts/public-build-record.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain sanitized public smoke receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-public-smoke-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-public/smoke/*.json
          if-no-files-found: warn
          retention-days: 30

  qualification:
    name: Public native qualification is incomplete — publication blocked
    if: always() && github.repository == 'PhysicalSystems/desktop' && github.ref == 'refs/heads/main' && needs.prepare.result == 'success'
    needs: [prepare, source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"
      - name: Fail closed until all required native evidence is implemented and verified
        run: bun script/desktop-public-producer.ts incomplete
