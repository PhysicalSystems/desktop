name: Prepare desktop candidate (no publication)
run-name: ${{ inputs.browser_factory_diagnostic && format('{0} browser factory diagnostic', inputs.browser_factory_platform || 'linux-x64') || format('Desktop {0} candidate', inputs.channel) }} from ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full commit SHA (empty uses this workflow revision)
        type: string
        required: false
      channel:
        description: Candidate version track; this does not publish or change an update channel
        type: choice
        options: [preview, stable]
        default: preview
        required: true
      version:
        description: Optional preview version; stable requires an explicit version
        type: string
        required: false
      diagnostic_public_key:
        description: Optional RSA public PEM (3072+ bits) for encrypted bounded startup logs; never provide a private key
        type: string
        required: false
      browser_review:
        description: Verify the native browser handoff against an owned loopback fixture; no provider sign-in
        type: boolean
        default: false
        required: false
      browser_factory_diagnostic:
        description: Browser startup and cleanup only; skips desktop build, candidate and provider qualification
        type: boolean
        default: false
        required: false
      browser_factory_loopback:
        description: Optional Windows OS loopback handoff inside the factory diagnostic; no desktop or provider qualification
        type: boolean
        default: false
        required: false
      browser_factory_platform:
        description: Hosted platform for the optional browser factory diagnostic only
        type: choice
        options: [linux-x64, windows-x64]
        default: linux-x64
        required: false
      provider_qa:
        description: Optional real account review; selected device grant must be authorized by its reviewer
        type: choice
        options: [disabled, openai-device]
        default: disabled
        required: false
      provider_qa_public_key:
        description: Reviewer RSA public PEM only, for the encrypted expiring device-code challenge
        type: string
        required: false
      provider_qa_key_sha256:
        description: Independently verified SHA-256 of the reviewer public key in DER SPKI format
        type: string
        required: false

# These jobs cannot publish releases, push tags, attest, sign or change a website.
permissions:
  contents: read

# Do this before checkout, including on Windows. Line-ending conversion would
# change immutable input bytes and must not be hidden by hash normalization.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  PHYSICALSYSTEMS_RELEASE_REPOSITORY: ${{ github.repository }}

# Allocation is serialized. Candidate versions are provisional until an independently
# authorized publisher reserves them; an unsigned candidate does not create a tag.
# Diagnostics allocate no versions and serialize only within their branch/platform.
concurrency:
  group: ${{ inputs.browser_factory_diagnostic && format('desktop-browser-diagnostic-{0}-{1}', github.ref, inputs.browser_factory_platform == 'windows-x64' && 'windows-x64' || 'linux-x64') || 'desktop-release-candidate' }}
  cancel-in-progress: false

jobs:
  browser-diagnostic:
    name: Browser acquisition and cleanup diagnostic (${{ inputs.browser_factory_platform || 'linux-x64' }})
    if: inputs.browser_factory_diagnostic
    runs-on: ${{ inputs.browser_factory_platform == 'windows-x64' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      BROWSER_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      BROWSER_DIAGNOSTIC_PLATFORM: ${{ inputs.browser_factory_platform || 'linux-x64' }}
      BROWSER_DIAGNOSTIC_LOOPBACK: ${{ inputs.browser_factory_loopback && '1' || '0' }}
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
    steps:
      - name: Require the exact dispatched workflow revision before checkout
        run: |
          node --input-type=module <<'NODE'
          const source = process.env.BROWSER_DIAGNOSTIC_SOURCE_SHA;
          const platform = process.env.BROWSER_DIAGNOSTIC_PLATFORM;
          if (process.env.GITHUB_REPOSITORY !== 'PhysicalSystems/desktop' ||
              process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
              !['linux-x64', 'windows-x64'].includes(platform) || process.env.RUNNER_ARCH !== 'X64' ||
              !['0', '1'].includes(process.env.BROWSER_DIAGNOSTIC_LOOPBACK) ||
              (process.env.BROWSER_DIAGNOSTIC_LOOPBACK === '1' && platform !== 'windows-x64') ||
              process.env.RUNNER_OS !== (platform === 'windows-x64' ? 'Windows' : 'Linux') ||
              !/^[a-f0-9]{40}$/.test(source || '') || source !== process.env.GITHUB_SHA)
            throw new Error('Browser diagnostic requires the exact owned workflow revision');
          NODE
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"
      - name: Verify the hosted runner browser and display prerequisites
        if: runner.os == 'Linux'
        run: |
          for executable in /usr/bin/Xvfb /usr/bin/xvfb-run /usr/bin/xauth /opt/google/chrome/chrome; do
            if [ ! -x "$executable" ]; then
              echo 'BROWSER_DIAGNOSTIC_PREREQUISITE_UNAVAILABLE' >&2
              exit 1
            fi
          done
      - name: Start and stop the actual owned Linux browser factory
        if: runner.os == 'Linux'
        run: timeout --signal=TERM --kill-after=10s 90s xvfb-run -a bun script/desktop-browser-diagnostic.ts
      - name: Verify Windows process lifecycle regressions with inert callbacks
        if: runner.os == 'Windows'
        working-directory: packages/physicalsystems
        run: bun test ./src/release/windows-review-native.test.ts ./src/release/windows-review-transport.test.ts ./src/release/windows-loopback-diagnostic.test.ts ./src/release/browser-private-diagnostic.test.ts ./src/release/windows-app-shutdown-native.test.ts ./src/release/windows-app-shutdown-observation.test.ts ./src/release/native-upgrade-process.test.ts ./src/release/owned-browser-directory.test.ts
      - name: Diagnose the owned Windows browser with optional OS loopback handoff
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          BROWSER_DIAGNOSTIC_PUBLIC_KEY_PEM: ${{ inputs.diagnostic_public_key }}
        run: bun script/desktop-browser-diagnostic.ts
      - name: Retain only the sanitized browser diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-browser-diagnostic-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-browser-diagnostic-report/browser-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain only optional encrypted executable diagnostics
        if: always() && inputs.browser_factory_loopback && inputs.diagnostic_public_key != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-browser-sealed-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-browser-sealed-diagnostics/*.sealed.json
          if-no-files-found: warn
          retention-days: 3

  prepare:
    name: Freeze source and release inputs
    if: ${{ !inputs.browser_factory_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      inputs_sha256: ${{ steps.inputs.outputs.sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CHANNEL: ${{ inputs.channel }}
      REQUESTED_VERSION: ${{ inputs.version }}
      BROWSER_DIAGNOSTIC_LOOPBACK: ${{ inputs.browser_factory_loopback && '1' || '0' }}
    steps:
      - name: Reject diagnostic-only options in candidate mode
        run: |
          if [ "$BROWSER_DIAGNOSTIC_LOOPBACK" != "0" ]; then
            echo 'BROWSER_DIAGNOSTIC_CONTEXT_UNCONFIRMED' >&2
            exit 1
          fi
      - name: Require an immutable source revision
        id: source
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          if (!/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA)) throw new Error('source_sha must be a full lowercase commit SHA');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${process.env.SOURCE_SHA}\n`);
          NODE
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"

      - name: Read complete desktop release history from the public download repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-release"
          destination=$(node -p 'const p=require("./release/desktop.json"); if(p.publicReleaseRepository !== "PhysicalSystems/physicalsystems") throw new Error("Unreviewed public download destination"); p.publicReleaseRepository')
          gh api --paginate --slurp "repos/$destination/releases?per_page=100" > "$RUNNER_TEMP/desktop-release/history-pages.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'desktop-release');
          const pages = JSON.parse(readFileSync(path.join(root, 'history-pages.json'), 'utf8'));
          if (!Array.isArray(pages) || !pages.length || pages.some(page => !Array.isArray(page))) throw new Error('Incomplete release history');
          const prefix = JSON.parse(readFileSync('release/desktop.json', 'utf8')).tagPrefix;
          if (prefix !== 'desktop-v') throw new Error('Unexpected desktop tag namespace');
          const releases = pages.flat();
          if (releases.some(release => typeof release.tag_name !== 'string')) throw new Error('Malformed release history');
          // Drafts and prereleases count too. Unrelated inherited upstream tags do not.
          const versions = releases.filter(release => release.tag_name.startsWith(prefix)).map(release => release.tag_name.slice(prefix.length));
          writeFileSync(path.join(root, 'history.json'), JSON.stringify({ complete: true, versions }, null, 2) + '\n');
          NODE

      - name: Prepare immutable candidate inputs
        id: inputs
        run: |
          args=(--source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" --channel "$CHANNEL" --history "$RUNNER_TEMP/desktop-release/history.json" --output "$RUNNER_TEMP/desktop-release/inputs")
          if [ -n "$REQUESTED_VERSION" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          bun script/desktop-release.ts prepare "${args[@]}"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const inputs = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'desktop-release', 'inputs', 'release-inputs.json'), 'utf8'));
          if (!/^[a-f0-9]{64}$/.test(inputs.sha256)) throw new Error('Missing immutable input digest');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${inputs.sha256}\n`);
          appendFileSync(process.env.GITHUB_ENV, `PHYSICALSYSTEMS_EXPECTED_INPUTS_SHA256=${inputs.sha256}\n`);
          NODE

      - name: Verify prepared inputs against the trusted preparation digest
        run: bun script/desktop-release.ts verify-inputs --inputs "$RUNNER_TEMP/desktop-release/inputs/release-inputs.json"

      - name: Retain immutable input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-release/inputs/
          if-no-files-found: error
          retention-days: 30

  source:
    name: Validate candidate source
    needs: prepare
    uses: ./.github/workflows/desktop-ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  package:
    name: Package and qualify ${{ matrix.platform }}
    needs: [prepare, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PHYSICALSYSTEMS_EXPECTED_INPUTS_SHA256: ${{ needs.prepare.outputs.inputs_sha256 }}
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
      - name: Verify native source archive staging
        working-directory: packages/physicalsystems
        run: bun test ./src/release/commands.test.ts ./src/release/packaged-archive.test.ts ./src/release/native-upgrade-process.test.ts ./src/release/owned-browser-directory.test.ts ./src/release/windows-app-shutdown-native.test.ts ./src/release/windows-app-shutdown-observation.test.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-release/inputs

      - name: Install display dependencies on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 apparmor libnotify4 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0 dbus gnome-keyring libglib2.0-bin

      - name: Verify fixed inputs before building
        run: bun script/desktop-release.ts verify-inputs --inputs "$RUNNER_TEMP/desktop-release/inputs/release-inputs.json"

      - name: Build candidate formats with publication disabled
        id: build
        run: bun script/desktop-release.ts build --inputs "$RUNNER_TEMP/desktop-release/inputs/release-inputs.json" --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/desktop-release/artifacts"

      - name: Qualify the actual packaged applications
        id: qualify
        uses: ./.github/actions/provider-review-runtime
        with:
          mode: candidate
        env:
          PS_DIAGNOSTIC_PUBLIC_KEY_PEM: ${{ inputs.diagnostic_public_key }}
          PS_DIAGNOSTIC_DIRECTORY: ${{ runner.temp }}/desktop-release/sealed-diagnostics
          PS_PROVIDER_REVIEW: ${{ inputs.provider_qa }}
          PS_BROWSER_REVIEW: ${{ inputs.browser_review && '1' || '0' }}
          PS_PROVIDER_REVIEW_PUBLIC_KEY_PEM: ${{ inputs.provider_qa_public_key }}
          PS_PROVIDER_REVIEW_KEY_SHA256: ${{ inputs.provider_qa_key_sha256 }}
          PHYSICALSYSTEMS_PROVIDER_REVIEW_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}

      - name: Verify bytes and sanitized qualification receipts
        id: verify
        if: always() && steps.build.outcome == 'success'
        run: bun script/desktop-release.ts verify-artifacts --inputs "$RUNNER_TEMP/desktop-release/inputs/release-inputs.json" --artifacts "$RUNNER_TEMP/desktop-release/artifacts" --receipts "$RUNNER_TEMP/desktop-release/receipts" --output "$RUNNER_TEMP/desktop-release/reports"

      - name: Record stage outcomes even when preparation or packaging fails
        if: always()
        env:
          CANDIDATE_SOURCE: ${{ needs.prepare.outputs.source_sha }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CURRENT_JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'desktop-release', 'reports');
          mkdirSync(dir, { recursive: true });
          writeFileSync(path.join(dir, 'workflow-status.json'), JSON.stringify({
            schemaVersion: 1, source: process.env.CANDIDATE_SOURCE, platform: process.env.CANDIDATE_PLATFORM,
            build: process.env.BUILD_OUTCOME || 'not-run', qualification: process.env.QUALIFY_OUTCOME || 'not-run',
            verification: process.env.VERIFY_OUTCOME || 'not-run', job: process.env.CURRENT_JOB_STATUS,
            publication: false,
          }, null, 2) + '\n');
          NODE

      # The optional envelope contains only encrypted bounded startup diagnostics.
      # Its private key never reaches the runner. It is not release evidence.
      - name: Retain optional encrypted startup diagnostics
        if: always() && inputs.diagnostic_public_key != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-sealed-diagnostics-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-release/sealed-diagnostics/*.sealed.json
          if-no-files-found: warn
          retention-days: 3

      # Only generated public-safe receipts are retained. Never upload temporary
      # profiles, browser logs, credentials, runtime attachment files or screenshots.
      - name: Retain qualification receipts even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-report-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-release/reports/*.json
            ${{ runner.temp }}/desktop-release/reports/*.md
            ${{ runner.temp }}/desktop-release/reports/SHA256SUMS
            ${{ runner.temp }}/desktop-release/receipts/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Retain exact candidate installers for internal review
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-candidate-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-release/artifacts/*.exe
            ${{ runner.temp }}/desktop-release/artifacts/*.deb
            ${{ runner.temp }}/desktop-release/artifacts/*.AppImage
            ${{ runner.temp }}/desktop-release/artifacts/artifacts.json
            ${{ runner.temp }}/desktop-release/artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Candidate assessment (publication remains blocked)
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PHYSICALSYSTEMS_EXPECTED_INPUTS_SHA256: ${{ needs.prepare.outputs.inputs_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-release/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-report-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-release/platform-reports

      - name: Produce the candidate assessment
        run: bun script/desktop-release.ts summarize --inputs "$RUNNER_TEMP/desktop-release/inputs/release-inputs.json" --reports "$RUNNER_TEMP/desktop-release/platform-reports" --output "$RUNNER_TEMP/desktop-release/summary"
      - name: Display assessment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/desktop-release/summary/summary.md" ]; then
            cat "$RUNNER_TEMP/desktop-release/summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Candidate assessment incomplete. Publication is blocked; inspect the failed jobs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-release/summary/*.json
            ${{ runner.temp }}/desktop-release/summary/*.md
          if-no-files-found: warn
          retention-days: 30
