name: Promote verified desktop downloads (disabled by default)
run-name: Review desktop downloads from run ${{ inputs.review_run_id }} attempt ${{ inputs.review_run_attempt }}

# Recovery entrypoint for a completed, approved public publisher run. Normal
# publication invokes the same website coordinator inside its single protected
# publish job. This explicit recovery path retains its own environment approval.
# It verifies exact public bytes, checks the selection-only website PR, merges
# the validated commit, and confirms the existing Render deployment.
on:
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Successful public publisher run ID
        type: string
        required: true
      review_run_attempt:
        description: Exact successful public publisher run attempt
        type: string
        required: true
      review_source_sha:
        description: Reviewed full source commit SHA from the public publisher
        type: string
        required: true
      expected_review_sha256:
        description: Canonical review SHA-256 from the trusted publisher summary, not from its downloaded artifact
        type: string
        required: true
  workflow_call:
    inputs:
      review_run_id:
        description: Successful public publisher run ID
        type: string
        required: true
      review_run_attempt:
        description: Exact successful public publisher run attempt
        type: string
        required: true
      review_source_sha:
        description: Reviewed full source commit SHA from the public publisher
        type: string
        required: true
      expected_review_sha256:
        description: Canonical review SHA-256 anchored by the trusted publisher summary
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-download-promotion
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  verify:
    name: Verify public release and exact download selection
    if: vars.DESKTOP_DOWNLOAD_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.publisher.outputs.source_sha }}
      selection_sha256: ${{ steps.selection.outputs.sha256 }}
    steps:
      - name: Verify the reviewed public publisher run and protection prerequisite
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ inputs.review_run_attempt }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
          EXPECTED_REVIEW_SHA256: ${{ inputs.expected_review_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const env = process.env;
          if (!/^[1-9][0-9]*$/.test(env.REVIEW_RUN_ID) || !/^[1-9][0-9]*$/.test(env.REVIEW_RUN_ATTEMPT)) throw new Error('Run ID and attempt must be positive integers');
          if (!/^[a-f0-9]{40}$/.test(env.REVIEW_SOURCE_SHA) || !/^[a-f0-9]{64}$/.test(env.EXPECTED_REVIEW_SHA256)) throw new Error('Reviewed source and digest must be exact lowercase identities');
          const api = async path => {
            const response = await fetch(`${env.GITHUB_API_URL}/repos/${env.GITHUB_REPOSITORY}/${path}`, {
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              redirect: 'error', signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error(`Public review prerequisite could not be read (${response.status})`);
            return response.json();
          };
          const [run, attempt, environment] = await Promise.all([
            api(`actions/runs/${env.REVIEW_RUN_ID}`),
            api(`actions/runs/${env.REVIEW_RUN_ID}/attempts/${env.REVIEW_RUN_ATTEMPT}`),
            api('environments/desktop-download-promotion'),
          ]);
          for (const value of [run, attempt]) {
            if (String(value.id) !== env.REVIEW_RUN_ID || String(value.run_attempt) !== env.REVIEW_RUN_ATTEMPT ||
                value.status !== 'completed' || value.conclusion !== 'success' ||
                value.path !== '.github/workflows/desktop-public-release.yml' ||
                value.head_sha !== env.REVIEW_SOURCE_SHA || value.repository?.full_name !== env.GITHUB_REPOSITORY ||
                String(value.repository?.id) !== env.GITHUB_REPOSITORY_ID || value.head_repository?.full_name !== env.GITHUB_REPOSITORY) {
              throw new Error('Expected the exact successful current attempt of the reviewed public publisher in this repository');
            }
          }
          if (environment.name !== 'desktop-download-promotion' || !environment.protection_rules?.some(rule => rule.type === 'required_reviewers' && Array.isArray(rule.reviewers) && rule.reviewers.length > 0)) {
            throw new Error('Configure required reviewers on the desktop-download-promotion environment before enabling this workflow');
          }
          appendFileSync(env.GITHUB_OUTPUT, `source_sha=${env.REVIEW_SOURCE_SHA}\n`);
          NODE

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.publisher.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"
      - name: Download only the named public review from the validated run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-public-review-${{ inputs.review_run_id }}-${{ inputs.review_run_attempt }}
          path: ${{ runner.temp }}/desktop-public-review
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}

      - name: Check the artifact against the independently supplied review digest
        env:
          EXPECTED_REVIEW_SHA256: ${{ inputs.expected_review_sha256 }}
          REVIEW_SOURCE_SHA: ${{ inputs.review_source_sha }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
        run: |
          bun run - <<'BUN'
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';
          import { publicReviewDigest } from './packages/physicalsystems/src/release/public-downloads.ts';
          const dir = path.join(process.env.RUNNER_TEMP, 'desktop-public-review');
          const entries = readdirSync(dir);
          if (entries.length !== 1 || entries[0] !== 'public-review.json') throw new Error('Public review artifact must contain exactly public-review.json');
          const file = path.join(dir, 'public-review.json');
          const stat = lstatSync(file);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > 1024 * 1024) throw new Error('Invalid public review artifact');
          const review = JSON.parse(readFileSync(file, 'utf8'));
          if (publicReviewDigest(review) !== process.env.EXPECTED_REVIEW_SHA256) throw new Error('Public review differs from its trusted publisher summary');
          if (review?.sourceRevision !== process.env.REVIEW_SOURCE_SHA || review?.approval?.protectedRunUrl !== `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.REVIEW_RUN_ID}`) throw new Error('Public review does not identify the validated publisher source and run');
          BUN

      - name: Verify public release metadata and exact published installer bytes
        env:
          EXPECTED_REVIEW_SHA256: ${{ inputs.expected_review_sha256 }}
        run: bun script/desktop-release.ts verify-public --review "$RUNNER_TEMP/desktop-public-review/public-review.json" --expected-review-sha256 "$EXPECTED_REVIEW_SHA256" --output "$RUNNER_TEMP/desktop-verified-selection"

      - name: Anchor the generated website selection
        id: selection
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const file = path.join(process.env.RUNNER_TEMP, 'desktop-verified-selection', 'desktop-selection.json');
          const stat = lstatSync(file);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > 1024 * 1024) throw new Error('Verified selection is unavailable');
          const sha256 = createHash('sha256').update(readFileSync(file)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Verified public download selection: \`${sha256}\`. Website promotion requires environment approval.\n`);
          NODE
      - name: Retain only verified website selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-download-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-verified-selection/desktop-selection.json
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Restore the verified website selection and confirm deployment
    if: vars.DESKTOP_DOWNLOAD_PROMOTION_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Required reviewers are checked above. Keep the website token exclusively in
    # this environment, scoped to PhysicalSystems/platform contents and PRs.
    environment: desktop-download-promotion
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
        with:
          install-dependencies: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-download-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-download-selection

      - name: Recheck the verified selection before granting website credentials
        env:
          EXPECTED_SELECTION_SHA256: ${{ needs.verify.outputs.selection_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';
          if (!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SELECTION_SHA256)) throw new Error('Missing trusted selection digest');
          const root = path.join(process.env.RUNNER_TEMP, 'desktop-download-selection');
          const entries = readdirSync(root);
          if (entries.length !== 1 || entries[0] !== 'desktop-selection.json') throw new Error('Unexpected selection artifact contents');
          const file = path.join(root, 'desktop-selection.json');
          const stat = lstatSync(file);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > 1024 * 1024) throw new Error('Invalid selection file');
          if (createHash('sha256').update(readFileSync(file)).digest('hex') !== process.env.EXPECTED_SELECTION_SHA256) throw new Error('Selection bytes changed after public verification');
          NODE

      - name: Prepare a website selection PR using compare-and-swap
        env:
          DESKTOP_WEBSITE_TOKEN: ${{ secrets.DESKTOP_WEBSITE_TOKEN }}
          EXPECTED_SELECTION_SHA256: ${{ needs.verify.outputs.selection_sha256 }}
        run: bun script/desktop-promote-website.ts --selection "$RUNNER_TEMP/desktop-download-selection/desktop-selection.json" --expected-sha256 "$EXPECTED_SELECTION_SHA256" --merge-after-checks
