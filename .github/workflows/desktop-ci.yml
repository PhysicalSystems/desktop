name: Desktop source checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_updater_test:
        description: Build an unpublished app and exercise its updater on disposable Windows and Ubuntu runners
        type: boolean
        required: false
        default: false
      updater_test_platform:
        description: Platforms for the unpublished updater test
        type: choice
        required: false
        default: both
        options: [both, windows, ubuntu]
      updater_test_history:
        description: Complete Desktop release history JSON for the unpublished updater test
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      source_sha:
        description: Exact candidate source revision
        type: string
        required: true

permissions:
  contents: read

# The vendored artifact and release input hashes refer to the committed bytes.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

concurrency:
  group: desktop-source-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select relevant checks
    if: github.repository == 'PhysicalSystems/desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
      release: ${{ steps.scope.outputs.release }}
      appearance: ${{ steps.scope.outputs.appearance }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete pull request diff
        id: scope
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { desktopChecks } from './script/desktop-ci-scope.mjs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const paths = process.env.GITHUB_EVENT_NAME === 'pull_request' && !process.env.SOURCE_SHA
            ? execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', `${event.pull_request.base.sha}...${process.env.GITHUB_SHA}`], { encoding: 'utf8' }).split('\0').filter(Boolean)
            : [];
          const checks = desktopChecks(paths, process.env.GITHUB_EVENT_NAME, process.env.SOURCE_SHA);
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(checks).map(([key, value]) => `${key}=${value}\n`).join(''));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Checks for ${paths.length} changed paths (release/manual runs always use the full suite):\n\n${Object.entries(checks).map(([key, value]) => `- ${key}: ${value ? 'run' : 'skip'}`).join('\n')}\n`);
          NODE

  windows-installer-owner:
    name: Windows installer owner fixture
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CI: "true"
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      PHYSICALSYSTEMS_WINDOWS_OWNER_FIXTURE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
      - name: Validate Windows recovery controller and owner protocol regressions
        working-directory: packages/physicalsystems
        run: bun test ./src/release/native-upgrade-process.test.ts ./src/release/windows-installer-owner.test.ts ./src/release/preview-update-windows.test.ts ./src/release/preview-update-windows-command-links.test.ts
      - name: Validate preview update discovery, downloads and native handoff on Windows
        working-directory: packages/desktop
        run: bun test ./src/main/desktop-update-discovery.test.ts ./src/main/preview-update-download.test.ts ./src/main/preview-update-install.test.ts ./src/main/preview-update-controller.test.ts ./src/main/preview-update-recovery.test.ts ./src/main/renderer-store.test.ts
      - name: Validate the actual Windows owner with an inert process tree
        working-directory: packages/physicalsystems
        run: bun ./src/release/windows-installer-owner.hosted.ts
      - name: Validate Windows browser process selection with inert records
        working-directory: packages/physicalsystems
        env:
          PHYSICALSYSTEMS_WINDOWS_REVIEW_SELECTION_FIXTURE: "1"
        run: bun ./src/release/windows-review-process-selection.hosted.ts

  linux-updater-dialog:
    name: Ubuntu updater dialog fixture
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en
      ACCESSIBILITY_ENABLED: "1"
      NO_AT_BRIDGE: "0"
      GTK_MODULES: atk-bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
      - uses: ./.github/actions/setup-desktop-apt
      - name: Install display and recognition dependencies on the disposable runner
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin pkexec polkitd python3-gi python3-pyatspi gir1.2-atspi-2.0 python3-xlib tesseract-ocr tesseract-ocr-eng libatk-adaptor at-spi2-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 apparmor libnotify4 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0
      - name: Exercise both choices in the inert Electron confirmation
        run: dbus-run-session -- xvfb-run -a bun packages/physicalsystems/test/preview-update-linux-inert.mjs
      - name: Retain owned dialog fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-update-linux-dialog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-update-linux-inert/result.json
            ${{ runner.temp }}/preview-update-linux-inert/native-dialog-later.png
            ${{ runner.temp }}/preview-update-linux-inert/native-dialog-install.png
            ${{ runner.temp }}/preview-update-linux-inert/native-dialog-diagnostic.png
          if-no-files-found: warn
          retention-days: 7

  regression:
    name: Source regression tests
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      GOMAXPROCS: "2"
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build

      - name: Check CI selection and required merge gate
        working-directory: packages/physicalsystems
        run: bun test ./test/desktop-ci-scope.test.ts

      - name: Integration regression tests
        working-directory: packages/physicalsystems
        run: |
          mapfile -d '' tests < <(find src -path src/release -prune -o -type f \( -name '*.test.*' -o -name '*.spec.*' \) -print0)
          test "${#tests[@]}" -gt 0
          bun test "${tests[@]/#/./}"

      - name: Release regression tests
        if: needs.scope.outputs.release == 'true'
        working-directory: packages/physicalsystems
        run: bun test ./src/release ./test/preview-update-state.test.ts

      - name: Physical Systems UI regression tests
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts ./src/physicalsystems

      - name: Managed workspace and conversation DOM regressions
        working-directory: packages/app
        run: bun test ./test-browser/physicalsystems-project-flow.test.ts

      - name: Rendered composer and provider sign-in regressions
        working-directory: packages/app
        run: bun test --conditions=browser --preload ./happydom.ts ./test-browser/composer-readiness.test.ts ./test-browser/oauth-browser.test.ts ./test-browser/provider-connection.test.ts ./test-browser/preview-update-button.test.ts ./test-browser/workcell-room.test.ts ./test-browser/cloud-conversation.test.ts ./test-browser/shared-workcells.test.ts

      - name: Provider attempt lifecycle regression
        working-directory: packages/app
        run: bun test ./src/runtime/server/oauth-attempt.test.ts

      - name: Appearance and updater UI regressions
        working-directory: packages/app
        run: bun test --conditions=solid --isolate --preload ../ui/test/solid-jsx.ts --preload ./happydom.ts ./src/theme-preload.test.ts ./src/shell/titlebar/windows-menu.test.ts ./src/components/updater-action.test.ts ./src/runtime/i18n/desktop-native.test.ts

      - uses: ./.github/actions/setup-desktop-apt
        if: needs.scope.outputs.appearance == 'true'
      - name: Install Chromium for isolated settings fixture
        if: needs.scope.outputs.appearance == 'true'
        timeout-minutes: 5
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Rendered Physical Systems appearance regression
        if: needs.scope.outputs.appearance == 'true'
        working-directory: packages/app
        env:
          PLAYWRIGHT_PORT: "5196"
          PLAYWRIGHT_WORKERS: "1"
        run: bunx playwright test ./e2e/regression/physical-settings-appearance.spec.ts --project chromium

      - name: Config, agent authority and adapter regression tests
        working-directory: packages/core
        run: bun test --timeout 30000 ./test/plugin/physicalsystems.test.ts ./test/config/config.test.ts

      - name: Actual provider credential and OAuth persistence regressions
        working-directory: packages/core
        run: bun test ./test/credential-native.test.ts ./test/credential.test.ts ./test/integration.test.ts

      - name: Physical Systems terminal plugin authority regressions
        working-directory: packages/tui
        run: bun test ./test/plugin-discovery.test.ts

      - name: Desktop startup diagnostic regression tests
        working-directory: packages/desktop
        run: bun test --timeout 30000 ./src/main/startup-trace.test.ts ./src/main/shutdown-trace.test.ts ./src/main/physical-worker.test.ts ./src/main/files/external-url.test.ts ./src/main/provider-account-trace.test.ts ./src/main/storage/legacy.test.ts ./src/main/desktop-launch.test.ts ./physical-launch.config.test.ts

      - name: Native cloud conversation bridge regression
        working-directory: packages/desktop
        run: bun test ./src/shared/conversation-account.test.ts ./src/shared/workcell-account.test.ts

      - name: Shared updater controller and install handoff regressions
        working-directory: packages/desktop
        run: bun test ./src/main/updater-controller.test.ts ./src/main/updater-install.test.ts ./src/main/service/sidecar-credentials.test.ts
      - name: Preview update discovery, downloads and native handoff regressions
        working-directory: packages/desktop
        run: bun test ./src/main/desktop-update-discovery.test.ts ./src/main/preview-update-download.test.ts ./src/main/preview-update-install.test.ts ./src/main/preview-update-controller.test.ts ./src/main/preview-update-recovery.test.ts ./src/main/renderer-store.test.ts

      - name: Typecheck integration
        working-directory: packages/physicalsystems
        run: bun typecheck
      - name: Typecheck app
        working-directory: packages/app
        run: bun typecheck
      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun typecheck
      - name: Typecheck agent server
        working-directory: packages/server
        run: bun typecheck
      - name: Typecheck core
        working-directory: packages/core
        run: bun typecheck

  # Keep the existing required check name. A failed/cancelled prerequisite must
  # fail this gate rather than turn into a skipped (and therefore passing) check.
  source:
    name: Source and authority checks
    if: always() && github.repository == 'PhysicalSystems/desktop'
    needs: [scope, regression, windows-installer-owner, linux-updater-dialog]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SOURCE_REQUIRED: ${{ needs.scope.outputs.source }}
          RELEASE_REQUIRED: ${{ needs.scope.outputs.release }}
          SOURCE_RESULT: ${{ needs.regression.result }}
          WINDOWS_RESULT: ${{ needs.windows-installer-owner.result }}
          LINUX_RESULT: ${{ needs.linux-updater-dialog.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SOURCE_REQUIRED" in
            true) test "$SOURCE_RESULT" = success ;;
            false) test "$SOURCE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          case "$RELEASE_REQUIRED" in
            true) test "$WINDOWS_RESULT" = success && test "$LINUX_RESULT" = success ;;
            false) test "$WINDOWS_RESULT" = skipped && test "$LINUX_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

  preview-updater-test:
    name: Unpublished app updater test (${{ matrix.os }})
    needs: [source]
    if: github.repository == 'PhysicalSystems/desktop' && github.event_name == 'workflow_dispatch' && inputs.preview_updater_test
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.updater_test_platform == 'ubuntu' && '["ubuntu-24.04"]' || inputs.updater_test_platform == 'windows' && '["windows-2025"]' || '["windows-2025","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PHYSICALSYSTEMS_ALLOW_DEVICES: "0"
      PHYSICALSYSTEMS_UPDATER_TEST: "1"
      UPDATER_TEST_HISTORY: ${{ inputs.updater_test_history }}
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GOMAXPROCS: "2"
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-build
      - name: Freeze clean source, complete history and official target metadata
        id: prepare
        run: bun script/desktop-preview-update-test.ts prepare
      - name: Build the unpublished updater test app
        env:
          UPDATER_TEST_PLAN_SHA256: ${{ steps.prepare.outputs.plan_sha256 }}
        run: bun script/desktop-preview-update-test.ts build
      - uses: ./.github/actions/setup-desktop-apt
        if: runner.os == 'Linux'
      - name: Install display and accessibility dependencies on the disposable Ubuntu runner
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin pkexec polkitd python3-gi python3-pyatspi gir1.2-atspi-2.0 python3-xlib tesseract-ocr tesseract-ocr-eng libatk-adaptor at-spi2-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 apparmor libnotify4 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0
      - name: Exercise actual app download, confirmation, installer and restart on Windows
        if: runner.os == 'Windows'
        env:
          UPDATER_TEST_ROOT: ${{ steps.prepare.outputs.root }}
          UPDATER_TEST_PLAN_SHA256: ${{ steps.prepare.outputs.plan_sha256 }}
        run: bun packages/physicalsystems/test/preview-update-native.mjs --root "$UPDATER_TEST_ROOT"
      - name: Exercise actual app download, confirmation, installer and restart on Ubuntu
        if: runner.os == 'Linux'
        env:
          UPDATER_TEST_ROOT: ${{ steps.prepare.outputs.root }}
          UPDATER_TEST_PLAN_SHA256: ${{ steps.prepare.outputs.plan_sha256 }}
        run: dbus-run-session -- xvfb-run -a bun packages/physicalsystems/test/preview-update-native.mjs --root "$UPDATER_TEST_ROOT"
      # This test grants no release qualification. Retain the sanitized result
      # and only the exact app-owned confirmation windows after public text
      # verification, before authentication. Never upload packages or profiles.
      - name: Retain sanitized updater test result
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-updater-test-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.root }}/result.json
            ${{ steps.prepare.outputs.root }}/native-dialog-later.png
            ${{ steps.prepare.outputs.root }}/native-dialog-install.png
            ${{ steps.prepare.outputs.root }}/native-dialog-diagnostic.png
          if-no-files-found: warn
          retention-days: 7
